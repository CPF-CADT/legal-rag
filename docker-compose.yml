services:
  chroma:
    image: ${CHROMA_IMAGE:-ghcr.io/chroma-core/chroma:1.5.9}
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - ${CHROMA_DATA_DIR:-./data/dense_retrieval/chroma_db}:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000;
          printf "GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection:
          close\r\n\r\n" >&3; grep -q "200" <&3'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
      - path: apps/telegram-bot/.env
        required: false
    environment:
      LEGALRAG_PROJECT_ROOT: /app
      PYTHONPATH: /app:/app/apps/core:/app/data-pipeline
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      CHROMA_SSL: "false"
      GEMINI_API_KEYS_FILE: /app/apps/api/secrets/gemini_api_keys.txt
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /app/data/huggingface
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./apps/api/secrets:/app/apps/api/secrets:ro
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    env_file:
      - path: apps/telegram_bot/.env
        required: false
    environment:
      LEGALRAG_API_URL: http://api:8000
    command: ["python", "-m", "apps.telegram_bot.main"]
    volumes:
      - ./apps/telegram_bot/logs:/app/apps/telegram_bot/logs
    depends_on:
      api:
        condition: service_healthy
